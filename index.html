function lum(hex){ const n=parseInt((hex||'#000').slice(1),16); const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }

  let s=size, ls; do{ ctx.font=`${peso} ${s}px ${fam}`; ls=lineas(ctx, txt, max); s-=4; } while(ls.length>maxLin && s>20);
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='top';
  const lh=(s+4)*alto; ls.forEach((l,i)=>ctx.fillText(l, x, y+i*lh)); return y+ls.length*lh;
}
function redondo(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  ctx.fillStyle='#fff'; ctx.fillRect(x,y,lado,lado); ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) ctx.fillRect(Math.floor(x+(c+1)*m), Math.floor(y+(r+1)*m), Math.ceil(m), Math.ceil(m)); }
async function lienzoMaterial(n, tipo){
  try{ await Promise.all(['800 60px "Baloo 2"','700 40px Nunito','400 40px Anton'].map(f=>document.fonts.load(f))); }catch{}
  const W = tipo==='afiche'?1748:1080, H = tipo==='afiche'?2480:1080, k = W/1748;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  const P=n.color_primario||'#460E0D', A=n.color_acento||'#F9B40F', claro=lum(P)>.45;
  const T=claro?'#111':'#fff', T2=claro?'rgba(0,0,0,.65)':'rgba(255,255,255,.82)';
  ctx.fillStyle=P; ctx.fillRect(0,0,W,H);
  const logo=await cargarImg(n.logo_url), url=linkInscripcion(n.slug), B='"Baloo 2", "Nunito", sans-serif', N='Nunito, sans-serif';
  let y;
  if(tipo==='afiche'){
    y=130;
    if(logo){ const bw=1000, bh=360, e=Math.min(bw/logo.width, bh/logo.height); const w=logo.width*e, h=logo.height*e; ctx.drawImage(logo,(W-w)/2,y+(bh-h)/2,w,h); y+=bh+70; }
    else y=textoCentrado(ctx, n.nombre, W/2, y+40, W-240, 150, 800, B, T, 2)+60;

    const lado=Math.min(980, H-y-560); ctx.fillStyle='#fff'; redondo(ctx,(W-lado)/2-40,y,lado+80,lado+80,60); ctx.fill(); dibujarQR(ctx,url,(W-lado)/2,y+40,lado); y+=lado+80+70;
    y=textoCentrado(ctx, `Junta ${n.meta_sellos} sellos y llévate`, W/2, y, W-240, 60, 700, N, T2, 1);
    y=textoCentrado(ctx, n.premio, W/2, y+10, W-220, 92, 800, B, A, 2, 1.05)+30;
    textoCentrado(ctx, `1 sello al día con compra desde ${soles(n.monto_minimo)}`, W/2, y, W-240, 48, 700, N, T2, 1);
    ctx.globalAlpha=.6; textoCentrado(ctx, 'YA! VOLVERÁS...', W/2, H-110, W, 44, 400, 'Anton, sans-serif', T, 1); ctx.globalAlpha=1;
  } else {
    y=60;
    if(logo){ const bw=560, bh=170, e=Math.min(bw/logo.width, bh/logo.height); const w=logo.width*e, h=logo.height*e; ctx.drawImage(logo,(W-w)/2,y+(bh-h)/2,w,h); y+=bh+24; }
    else y=textoCentrado(ctx, n.nombre, W/2, y+10, W-160, 92, 800, B, T, 1)+20;

}

const BLOQ_MIN=5; let desbloq={hasta:0,nombre:''};
const adminsLocal = () => panel ? panel.personal.filter(p=>p.activo && (p.rol==='caja'||p.rol==='encargado')) : [];
const puedeBloquear = () => panel && panel.es_admin && !panel.es_superadmin && adminsLocal().length>0;
const libre = () => !puedeBloquear() || Date.now()<desbloq.hasta;
function bloquear(aviso){ desbloq={hasta:0,nombre:''}; olvidarPin(); render(); if(aviso) alertMsg(aviso); }
['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>{ if(desbloq.hasta>Date.now()) desbloq.hasta=Date.now()+BLOQ_MIN*60000; },{passive:true}));
setInterval(()=>{ if(desbloq.hasta && Date.now()>=desbloq.hasta && panel && !document.querySelector('.hoja')) bloquear('Se activó el modo empleado.'); },10000);
function pedirDesbloqueo(){
  const ad=adminsLocal(), ult=store.get('jf_admin');
  const ov=document.createElement('div'); ov.className='hoja';
  ov.innerHTML=`<form class="card" id="fd"><div class="row" style="justify-content:space-between"><h3>Modo dueño</h3><button type="button" class="btn sm danger" id="dx" style="height:34px;width:auto;padding:0 12px;font-size:13px">Cancelar</button></div>
    <p class="hint" style="color:var(--crema)">Solo Caja o Encargado. Da acceso a Historial, Estadísticas y Panel; se bloquea solo tras ${BLOQ_MIN} minutos sin uso.</p>
    <div class="row"><div class="field grow"><label>¿Quién eres?</label><select id="dq">${ad.map(p=>`<option value="${p.id}" ${p.id===ult?'selected':''}>${esc(p.nombre)} · ${p.rol}</option>`).join('')}</select></div>
    <div class="field" style="width:120px"><label for="dp">PIN</label><input id="dp" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••" required></div></div>
    <div id="dm" class="msg err hidden"></div><button class="btn" type="submit">${icon.unlock.replace('<svg','<svg style="width:20px;height:20px"')}Desbloquear</button></form>`;
  document.body.appendChild(ov); const cerrar=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) cerrar(); }; $('#dx').onclick=cerrar; setTimeout(()=>$('#dp').focus(),50);
  $('#fd').onsubmit=async ev=>{ ev.preventDefault(); const b=ov.querySelector('button[type=submit]'); b.disabled=true;
    try{ const r=await rpc('desbloquear_admin',{p_personal_id:$('#dq').value,p_pin:$('#dp').value}); store.set('jf_admin',$('#dq').value);
      desbloq={hasta:Date.now()+BLOQ_MIN*60000,nombre:r.nombre}; cerrar(); render(); alertMsg(`Modo dueño activo: ${r.nombre}.`);
    }catch(e){ const m=$('#dm'); m.textContent=/PIN/.test(e.message)?'PIN incorrecto.':e.message; m.classList.remove('hidden'); $('#dp').value=''; $('#dp').focus(); b.disabled=false; } };
}
function vQR(){
  $('#titulo').textContent='QR clientes'; const n=panel.negocio, url=linkInscripcion(n.slug);
  $('#vista').innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="card outline" style="gap:4px"><span class="eyebrow" style="text-transform:none;letter-spacing:.02em">Muéstrale esta pantalla al cliente</span><span class="display" style="font-size:19px">Escanea con la cámara y guarda tu tarjeta de ${esc(n.nombre)}</span></div>
    <div class="qrgrande">${qrSVG(url)}</div>
    <p class="hint center" style="color:var(--crema)">Pone su nombre y celular, y la tarjeta queda en su Apple Wallet o Google Wallet. Junta ${n.meta_sellos} sellos y gana: ${esc(n.premio)}.</p>
  </div>`;
}
let pinCache={id:null,pin:'',t:0}; const PIN_MIN=15;
function pinVigente(id){ return pinCache.id===id && pinCache.pin && (Date.now()-pinCache.t) < PIN_MIN*60000 ? pinCache.pin : ''; }
function selectorPersonal(){
  const ult = store.get('jf_personal');
  return `<div class="row">
    <div class="field grow"><label>¿Quién registra?</label><select id="quien">${panel.personal.filter(p=>p.activo).map(p=>`<option value="${p.id}" ${p.id===ult?'selected':''}>${esc(p.nombre)} · ${p.rol}</option>`).join('')}</select></div>
    <div class="field" style="width:120px"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••" value="${esc(pinVigente(ult))}"></div>
  </div>`;
}
function enlazarPin(){ const q=$('#quien'), p=$('#pin'); if(!q||!p) return; q.onchange=()=>{ p.value=pinVigente(q.value); if(!p.value) p.focus(); }; }
function leerPersonal(){ const q=$('#quien'); if(!q||!q.value) throw new Error('Agrega personal en el Panel antes de registrar.'); store.set('jf_personal', q.value); const pin=$('#pin').value; if(pin.length<4) throw new Error('Escribe tu PIN.'); return {p_personal_id:q.value, p_pin:pin}; }
function recordarPin(per){ pinCache={id:per.p_personal_id, pin:per.p_pin, t:Date.now()}; }
function olvidarPin(){ pinCache={id:null,pin:'',t:0}; }

function bloqueCliente(c, est){
  return `<div class="item"><div class="avatar">${ini(c.nombre)}</div><div class="grow"><div class="t">${esc(c.nombre)}</div><div class="s">${esc(c.celular)}${est&&est.ultima_compra?` · última compra ${fecha(est.ultima_compra.fecha)} · ${soles(est.ultima_compra.monto)}`:''}</div></div>${est?`<span class="display" style="font-size:18px;color:var(--amarillo)">${est.sellos} de ${est.meta}</span>`:''}</div>`;
}

const waTarjeta = c => `https://wa.me/51${String(c.celular).replace(/\D/g,'').slice(-9)}?text=${encodeURIComponent(msgTarjeta(c.nombre, panel.negocio.nombre, `${BASE_URL}?t=${c.token}`))}`;
const btnReenviar = c => `<a class="btn sm ghost" style="text-decoration:none;height:40px" href="${waTarjeta(c)}" target="_blank" rel="noopener"><span style="width:18px;height:18px">${icon.wa}</span>Reenviar su tarjeta por WhatsApp</a>`;
function dobleToque(btn, fn){ let arm=false, t; const o=btn.innerHTML; btn.onclick=()=>{ if(!arm){ arm=true; btn.textContent='¿Seguro? Toca otra vez'; t=setTimeout(()=>{ arm=false; btn.innerHTML=o; },3500); return; } clearTimeout(t); arm=false; fn(); }; }
let canjePendiente=null;
async function anularMio(compraId){ const per=leerPersonal(); await rpc('anular_compra',{p_compra_id:compraId, p_motivo:'Error al registrar (deshecho por quien lo registró)', ...per}); recordarPin(per); }
async function cargarHoy(){
  const box=$('#hoy'), q=$('#quien'); if(!box||!q||!q.value) return;
  const nom=(panel.personal.find(p=>p.id===q.value)||{}).nombre||'';
  try{ const r=await rpc('mis_registros_hoy',{p_personal_id:q.value}); if($('#quien')?.value!==q.value) return;
    const hora=t=>new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
    box.innerHTML=`<div class="card outline" style="gap:10px"><div class="row" style="justify-content:space-between"><h3>Hoy · ${esc(nom)}</h3><span class="hint" style="color:var(--crema)">Solo tus registros</span></div>
      <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[['Ventas',r.ventas],['Sellos',r.sellos],['Premios entregados',r.canjes]].map(([l,v])=>`<div class="kpi"><div class="n">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
      ${r.ultimos.length?`<div class="list">${r.ultimos.map(u=>`<div class="item" style="padding:10px 12px"><div class="grow"><div class="t" style="${u.anulada?'text-decoration:line-through;opacity:.6':''}">${esc(u.cliente)}</div><div class="s">${hora(u.creado_en)} · ${soles(u.monto)}</div></div>${u.anulada?'<span class="chip">Anulada</span>':u.anulable?`<button class="btn sm danger" data-anular="${u.id}" style="height:34px;width:auto;padding:0 12px;font-size:13px">Anular</button>`:''}</div>`).join('')}</div><p class="hint" style="color:var(--crema)">Puedes anular un registro tuyo hasta 10 minutos después. Luego, solo el encargado.</p>`:`<p class="hint" style="color:var(--crema)">Aún no registras ventas hoy.</p>`}</div>`;
    box.querySelectorAll('[data-anular]').forEach(b=>dobleToque(b, async()=>{ b.disabled=true; try{ await anularMio(b.dataset.anular); alertMsg('Registro anulado. Se quitó el sello.'); cargarHoy(); }catch(e){ if(/PIN/.test(e.message)){ olvidarPin(); $('#pin').value=''; } alertMsg(e.message); b.disabled=false; } }));
  }catch{ box.innerHTML=''; }
}

// ----- Registrar compra -----
let clienteSel=null;
function vRegistrar(){
  $('#titulo').textContent='Caja';
  $('#vista').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    ${selectorPersonal()}
    <div class="field"><label for="cel">Celular del cliente</label>
      <div class="row"><input id="cel" class="grow" type="tel" inputmode="numeric" maxlength="12" placeholder="987 654 321"><button class="btn sm ghost" id="scan" aria-label="Escanear QR" style="width:50px;padding:0">${icon.scan}</button></div></div>
    <div id="res" class="list"></div>
    <div id="nuevo" class="field hidden"><label for="nom">Cliente nuevo: nombre</label><input id="nom" placeholder="Nombre y apellido"></div>
    <div id="cli"></div>
    <div class="field"><label for="monto">Monto de la compra</label><div class="money"><span>S/</span><input id="monto" type="text" inputmode="decimal" placeholder="0.00"></div>
      <span class="hint" style="margin-top:6px">Desde ${soles(panel.negocio.monto_minimo)} suma 1 sello. Máximo 1 sello por cliente al día.</span></div>
    <div id="m" class="msg err hidden"></div>
    <button class="btn" id="go">Registrar compra y sumar sello</button>
    <div id="out"></div>
    <div id="hoy"></div>
  </div>`;
  enlazarPin(); if($('#quien')) $('#quien').addEventListener('change', cargarHoy); cargarHoy(); const cel=$('#cel'), res=$('#res'), nuevo=$('#nuevo'), cli=$('#cli'), m=$('#m'), out=$('#out');
  const err = t => { m.textContent=t; m.classList.remove('hidden'); };
  let timer; clienteSel=null;
  const buscar = async () => { const q=cel.value.replace(/\D/g,''); res.innerHTML=''; nuevo.classList.add('hidden'); cli.innerHTML=''; clienteSel=null; if(q.length<3) return;
    try{ const lista = await rpc('buscar_clientes',{p_q:q});
      if(lista.length){ res.innerHTML = lista.map(c=>`<button class="item" style="border:0;text-align:left;width:100%;cursor:pointer" data-id="${c.id}" data-nombre="${esc(c.nombre)}" data-cel="${c.celular}"><div class="avatar">${ini(c.nombre)}</div><div class="grow"><div class="t">${esc(c.nombre)}</div><div class="s">${c.celular}</div></div></button>`).join('');
        res.querySelectorAll('button').forEach(b=>b.onclick=()=>elegir({id:b.dataset.id,nombre:b.dataset.nombre,celular:b.dataset.cel})); }
      if(q.length===9 && !lista.some(c=>c.celular===q)){ nuevo.classList.remove('hidden'); }
    }catch(e){ err(e.message); } };
  cel.oninput = () => { clearTimeout(timer); timer=setTimeout(buscar,300); };
  async function elegir(c){ clienteSel=c; res.innerHTML=''; nuevo.classList.add('hidden'); cli.innerHTML=`<div class="skeleton"></div>`;
    try{ estadoActual = await rpc('estado_tarjeta',{p_cliente_id:c.id}); const pd=estadoActual.premio_disponible;
      cli.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">${bloqueCliente(c, estadoActual)}
        ${pd?`<div class="card yellow premio-in" style="gap:6px"><span class="display" style="font-size:18px">Tiene un premio por entregar</span><span style="font-weight:700">${esc(pd.descripcion)}</span><span style="font-size:12.5px;font-weight:700">Vence el ${fecha(pd.vence_en)}. Ofréceselo ahora.</span><button class="btn sm" id="irCanje" style="background:var(--vino);color:var(--amarillo)">Entregar premio</button></div>`:''}
        ${btnReenviar({...c, ...estadoActual.cliente})}</div>`;
      if($('#irCanje')) $('#irCanje').onclick=()=>{ canjePendiente=c.id; tab='canjear'; render(); }; }catch(e){ cli.innerHTML=''; err(e.message); } $('#monto').focus(); }
  $('#scan').onclick = () => escanear(t => { const tok = (t.match(/[?&]t=([a-f0-9]+)/)||[])[1]; if(!tok) return err('Ese código no es de una tarjeta.'); buscarPorToken(tok); });
  async function buscarPorToken(tok){ try{ const e = await rpc('tarjeta_por_token',{p_token:tok}); const lista = await rpc('buscar_clientes',{p_q:e.cliente.nombre}); const c = lista.find(x=>x.token===tok); if(!c) return err('Esa tarjeta no es de este negocio.'); cel.value=c.celular; elegir(c); }catch(e){ err(e.message); } }
  $('#go').onclick = async () => { m.classList.add('hidden'); out.innerHTML=''; const b=$('#go'); b.disabled=true;
    try{ const per = leerPersonal();
      if(!clienteSel){ const q=cel.value.replace(/\D/g,''); if(q.length!==9) throw new Error('Escribe los 9 dígitos del celular y elige al cliente.'); const c = await rpc('buscar_o_crear_cliente',{p_nombre:$('#nom').value, p_celular:q}); clienteSel={id:c.id,nombre:c.nombre,celular:c.celular,token:c.token_tarjeta}; }
      const monto = parseFloat(String($('#monto').value).replace(',','.')); if(isNaN(monto)||monto<0) throw new Error('Escribe el monto de la compra.');
      const r = await rpc('registrar_compra',{p_cliente_id:clienteSel.id, p_monto:monto, ...per}); recordarPin(per);
      const link=`${BASE_URL}?t=${r.cliente.token}`; const wa=`https://wa.me/51${r.cliente.celular}?text=${encodeURIComponent(msgTarjeta(r.cliente.nombre, panel.negocio.nombre, link))}`;
      out.innerHTML = `<div class="card ${r.premio_nuevo?'yellow premio-in':'outline'}" style="margin-top:4px">
        <div class="row"><span style="width:26px;height:26px;flex-shrink:0">${icon.check}</span><div class="grow"><div class="display" style="font-size:16px">${r.premio_nuevo?`¡Tarjeta completa! ${esc(r.cliente.nombre.split(' ')[0])} llegó a ${r.meta} de ${r.meta}`:r.sumo_sello?`Sello sumado · ${esc(r.cliente.nombre.split(' ')[0])} tiene ${r.sellos} de ${r.meta}`:`${r.ya_sello_hoy?`Compra registrada · ${esc(r.cliente.nombre.split(' ')[0])} ya ganó su sello de hoy (máximo 1 al día)`:`Compra registrada (no suma sello: menor a ${soles(panel.negocio.monto_minimo)})`}`}</div><div class="s" style="font-size:12.5px">${soles(monto)} · ${fechaHora(new Date())}</div></div></div>
        ${r.premio_nuevo?`<div style="font-weight:700">Premio disponible: ${esc(panel.negocio.premio)} (vence en ${panel.negocio.premio_vigencia_dias} días). Su tarjeta vuelve a empezar en 0 de ${r.meta}.</div>`:''}
        <div class="stamps">${r.premio_nuevo?stampsHTML(r.meta,r.meta,r.meta):stampsHTML(r.sellos,r.meta,r.sumo_sello?r.sellos:0)}</div>
        <a class="btn sm ${r.premio_nuevo?'':'ghost'}" style="text-decoration:none;${r.premio_nuevo?'background:var(--vino);color:var(--amarillo)':''}" href="${wa}" target="_blank" rel="noopener"><span style="width:20px;height:20px">${icon.wa}</span>Enviar tarjeta por WhatsApp</a>
        ${r.referido?`<div style="font-weight:700;font-size:13.5px">${r.referido.premiado?`Regalo: ${esc(r.referido.nombre.split(' ')[0])} ganó 1 sello por invitar a ${esc(r.cliente.nombre.split(' ')[0])}.`:`${esc(r.referido.nombre.split(' ')[0])} lo invitó, pero ya usó sus 3 regalos de este mes.`}</div>`:''}
        <button class="btn sm danger" id="undo" style="height:38px">Me equivoqué: deshacer este registro</button>
      </div>`;
      const compraId=r.compra_id; dobleToque($('#undo'), async()=>{ $('#undo').disabled=true; try{ await anularMio(compraId); out.innerHTML=`<div class="msg ok">Registro deshecho. No se sumó el sello; vuelve a registrarlo bien.</div>`; cargarHoy(); }catch(e){ if(/PIN/.test(e.message)){ olvidarPin(); $('#pin').value=''; } err(e.message); $('#undo').disabled=false; } });
      cargarHoy();
      cel.value=''; $('#monto').value=''; clienteSel=null; cli.innerHTML=''; nuevo.classList.add('hidden'); cel.focus();
    }catch(e){ if(/PIN incorrecto/.test(e.message)){ olvidarPin(); $('#pin').value=''; } err(e.message); } b.disabled=false; };
}

// ----- Canjear premio -----
function vCanjear(){
  $('#titulo').textContent='Canjear premio';
  $('#vista').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    ${selectorPersonal()}
    <div class="field"><label for="q">Buscar cliente (celular o nombre)</label><div class="row"><input id="q" class="grow" placeholder="987 654 321"><button class="btn sm ghost" id="scan" aria-label="Escanear QR" style="width:50px;padding:0">${icon.scan}</button></div></div>
    <div id="res" class="list"></div><div id="det"></div><div id="m" class="msg err hidden"></div></div>`;
  enlazarPin(); const q=$('#q'), res=$('#res'), det=$('#det'), m=$('#m'); const err=t=>{m.textContent=t;m.classList.remove('hidden')};
  let timer; q.oninput=()=>{clearTimeout(timer);timer=setTimeout(async()=>{ det.innerHTML=''; if(q.value.trim().length<2){res.innerHTML='';return;} try{ const l=await rpc('buscar_clientes',{p_q:q.value.trim()}); res.innerHTML=l.map(c=>`<button class="item" style="border:0;text-align:left;width:100%;cursor:pointer" data-id="${c.id}"><div class="avatar">${ini(c.nombre)}</div><div class="grow"><div class="t">${esc(c.nombre)}</div><div class="s">${c.celular}</div></div></button>`).join('')||'<p class="hint">Sin resultados.</p>'; res.querySelectorAll('button').forEach(b=>b.onclick=()=>detalle(b.dataset.id)); }catch(e){err(e.message)} },300)};
  $('#scan').onclick=()=>escanear(async t=>{ const tok=(t.match(/[?&]t=([a-f0-9]+)/)||[])[1]; if(!tok) return err('Ese código no es de una tarjeta.'); try{ const e=await rpc('tarjeta_por_token',{p_token:tok}); const l=await rpc('buscar_clientes',{p_q:e.cliente.nombre}); const c=l.find(x=>x.token===tok); if(!c) return err('Esa tarjeta no es de este negocio.'); detalle(c.id);}catch(e){err(e.message)} });
  async function detalle(id){ res.innerHTML=''; m.classList.add('hidden'); det.innerHTML='<div class="skeleton"></div>';
    try{ const e=await rpc('estado_tarjeta',{p_cliente_id:id}); const p=e.premio_disponible;
      det.innerHTML = `${bloqueCliente(e.cliente,e)}
        <div class="card" style="margin-top:8px"><div class="stamps">${stampsHTML(e.sellos,e.meta)}</div><p class="sub">${mensajeSellos(e.sellos,e.meta,!!p)}</p>${e.cliente.token?btnReenviar(e.cliente):''}</div>
        ${p?`<div class="card yellow" style="margin-top:8px"><span class="display" style="font-size:18px">Premio disponible</span><span style="font-weight:600">${esc(p.descripcion)}</span><span style="font-size:12.5px;font-weight:700">Otorgado el ${fecha(p.otorgado_en)} · vence el ${fecha(p.vence_en)}</span>
             <button class="btn hold" id="canje" style="background:var(--vino);color:var(--amarillo);margin-top:6px"><div class="bar"></div><span style="position:relative">Mantén presionado para canjear</span></button></div>`
          :`<div class="msg ok" style="margin-top:8px">Este cliente no tiene premio disponible todavía.</div>`}`;
      if(p){ holdToConfirm($('#canje'), async()=>{ try{ const per=leerPersonal(); const r=await rpc('canjear_premio',{p_premio_id:p.id, ...per}); recordarPin(per); det.innerHTML=`<div class="card outline"><div class="row"><span style="width:26px;height:26px">${icon.check}</span><div class="display" style="font-size:17px">Premio entregado a ${esc(r.cliente.nombre.split(' ')[0])}</div></div><p class="sub">${esc(p.descripcion)} · ${fechaHora(new Date())}. Su tarjeta sigue en ${r.sellos} de ${r.meta}.</p></div>`; }catch(e){ if(/PIN incorrecto/.test(e.message)){ olvidarPin(); $('#pin').value=''; } err(e.message); } }); }
    }catch(e){ det.innerHTML=''; err(e.message); } }
  if(canjePendiente){ const id=canjePendiente; canjePendiente=null; detalle(id); }
}
function holdToConfirm(btn, fn){ let t; const start=()=>{ btn.classList.add('holding'); t=setTimeout(()=>{ btn.classList.remove('holding'); fn(); },1500); }; const stop=()=>{ btn.classList.remove('holding'); clearTimeout(t); };
  btn.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop)); btn.addEventListener('contextmenu',e=>e.preventDefault()); }

// ----- Historial -----
function vHistorial(){
  $('#titulo').textContent='Historial';
  $('#vista').innerHTML=`<div class="list" id="h"><div class="skeleton"></div><div class="skeleton"></div></div>`;
  rpc('historial',{p_limite:60}).then(l=>{ $('#h').innerHTML = l.length? l.map(c=>`<div class="item" style="${c.anulada?'opacity:.5':''};align-items:flex-start"><div class="avatar">${ini(c.cliente)}</div><div class="grow"><div class="row" style="justify-content:space-between;align-items:baseline"><span class="t">${esc(c.cliente)}</span><span class="display" style="font-size:17px;color:var(--amarillo);white-space:nowrap">${soles(c.monto)}</span></div><div class="s">${fechaHora(c.creado_en)} · ${esc(c.por)}${c.anulada?' · ANULADA':''}</div><div class="row" style="margin-top:6px;gap:6px">${c.suma_sello&&!c.anulada?'<span class="chip y">+1 sello</span>':'<span class="chip">sin sello</span>'}${panel.es_admin&&!c.anulada?`<button class="btn sm danger" data-id="${c.id}" style="height:30px;padding:0 10px;font-size:12.5px">Anular</button>`:''}</div></div></div>`).join('') : '<p class="hint">Todavía no hay compras registradas.</p>';

function delta(cur, prev, dias){
  cur=+cur||0; prev=+prev||0;
  if(!prev && !cur) return `<div class="delta eq">sin movimiento</div>`;
  if(!prev) return `<div class="delta up">▲ nuevo <span>vs. ${dias} días antes</span></div>`;
  const p=Math.round((cur-prev)/prev*100);
  if(p===0) return `<div class="delta eq">= igual <span>vs. ${dias} días antes</span></div>`;
  return `<div class="delta ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}% <span>vs. ${dias} días antes</span></div>`;
}
function waLink(cel, txt){ return `https://wa.me/51${cel}?text=${encodeURIComponent(txt)}`; }

    <div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><h3>Ventas por día</h3><span class="display" style="font-size:18px;color:var(--amarillo)">${soles(k.ventas)}</span></div>
      <div class="leyenda"><span><i></i>Últimos ${dias} días</span><span><i class="prev"></i>${dias} días anteriores</span></div>

      <div class="chart" id="ch_d">${graficoBarras(d.por_dia.map(x=>({v:x.compras,l:DIAS[x.dia-1].slice(0,2),t:`${DIAS[x.dia-1]} · ${x.compras} visita${x.compras==1?'':'s'}`})))}</div><div class="tip" id="tip_d"></div></div>

      <div class="chart" id="ch_h">${graficoBarras(rangoHoras(d.por_hora).map(x=>({v:x.compras,l:x.hora%2===0?hora12(x.hora).replace(' ',''):'',t:`${hora12(x.hora)} a ${hora12((x.hora+1)%24)} · ${x.compras} visita${x.compras==1?'':'s'}`})))}</div><div class="tip" id="tip_h"></div></div>`}

    <div class="card"><h3>Clientes que dejaron de venir</h3><p class="hint">Venían seguido (3 o más visitas) y no vuelven hace más de 3 semanas. Un mensaje a tiempo los recupera.</p>

  enlazarClienteMes();

function rangoHoras(ph){ const con=ph.filter(x=>x.compras>0); if(!con.length) return ph.filter(x=>x.hora>=8&&x.hora<=22); const a=Math.max(0,Math.min(...con.map(x=>x.hora))-1), b=Math.min(23,Math.max(...con.map(x=>x.hora))+1); return ph.filter(x=>x.hora>=a&&x.hora<=b); }

const CW=340;
function graficoLinea(serie){
  const H=170, L=6, R=6, T=22, B=22, n=serie.length, w=CW-L-R, h=H-T-B;
  const max=Math.max(1,...serie.map(s=>Math.max(+s.ventas,+s.ventas_prev)));
  const x=i=>L+(n>1?i*w/(n-1):w/2), y=v=>T+(1-(+v)/max)*h;
  const pts=k=>serie.map((s,i)=>`${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`).join(' L');
  const area=`M${x(0)},${T+h} L${pts('ventas')} L${x(n-1)},${T+h} Z`;
  const lab=[0,Math.floor((n-1)/2),n-1].map((i,j)=>`<text x="${x(i)}" y="${H-5}" text-anchor="${['start','middle','end'][j]}" font-size="11" fill="var(--rosa)" font-weight="700">${fecha(fechaISO(serie[i].fecha))}</text>`).join('');
  return `<svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="Ventas por día">
    ${[0,.5,1].map(t=>`<line x1="${L}" x2="${CW-R}" y1="${T+h*t}" y2="${T+h*t}" stroke="var(--vino3)" stroke-width="1"/>`).join('')}
    <text x="${L}" y="${T-8}" font-size="11" fill="var(--rosa)" font-weight="700">${soles(max).replace('.00','')}</text>
    <path d="${area}" fill="var(--amarillo)" opacity=".14"/>
    <path d="M${pts('ventas_prev')}" fill="none" stroke="var(--rosa)" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>
    <path d="M${pts('ventas')}" fill="none" stroke="var(--amarillo)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cx" x1="0" x2="0" y1="${T}" y2="${T+h}" stroke="var(--crema)" stroke-width="1" opacity="0"/>
    <circle id="cd" r="5" cx="0" cy="0" fill="var(--amarillo)" stroke="var(--vino2)" stroke-width="2" opacity="0"/>
    ${lab}
    <rect id="hit" x="0" y="0" width="${CW}" height="${H}" fill="transparent"/>
  </svg>`;
}
function hoverLinea(serie){
  const svg=$('#ch_l svg'); if(!svg) return; const n=serie.length, L=6, w=CW-12, T=22, h=170-44;
  const max=Math.max(1,...serie.map(s=>Math.max(+s.ventas,+s.ventas_prev)));
  const mover=ev=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*CW/r.width; const i=Math.max(0,Math.min(n-1,Math.round((px-L)/(n>1?w/(n-1):1)))); const s=serie[i]; const cx=L+(n>1?i*w/(n-1):w/2), cy=T+(1-(+s.ventas)/max)*h;
    $('#cx').setAttribute('x1',cx); $('#cx').setAttribute('x2',cx); $('#cx').setAttribute('opacity','.5'); const c=$('#cd'); c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('opacity','1');
    $('#tip_l').textContent=`${fechaISO(s.fecha).toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'short'})} · ${soles(s.ventas)} (${s.compras} compra${s.compras==1?'':'s'}) · antes ${soles(s.ventas_prev)}`; };
  svg.addEventListener('pointermove',mover); svg.addEventListener('pointerdown',mover);
}
function graficoBarras(items){
  const H=140, T=8, B=20, n=items.length, gap=n>12?2:6, bw=(CW-gap*(n-1))/n, h=H-T-B;
  const max=Math.max(1,...items.map(i=>i.v));
  return `<svg viewBox="0 0 ${CW} ${H}" role="img">
    <line x1="0" x2="${CW}" y1="${T+h}" y2="${T+h}" stroke="var(--vino3)" stroke-width="1"/>
    ${items.map((it,i)=>{ const x=i*(bw+gap), bh=it.v?Math.max(3,it.v/max*h):0, y=T+h-bh, r=Math.min(4,bw/2,bh); const top=it.v===max&&it.v>0;
      return `<g data-t="${esc(it.t)}">${bh?`<path d="M${x},${T+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${T+h} Z" fill="${top?'var(--amarillo)':'var(--borde)'}"/>`:''}
        ${it.l?`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--rosa)">${it.l}</text>`:''}
        <rect x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" fill="transparent"/></g>`; }).join('')}
  </svg>`;
}
function hoverBarras(id, tipId){ const svg=$('#'+id+' svg'); if(!svg) return; svg.querySelectorAll('g[data-t]').forEach(g=>{ const f=()=>{ $('#'+tipId).textContent=g.dataset.t; svg.querySelectorAll('g path').forEach(p=>p.style.opacity=''); svg.querySelectorAll('g').forEach(o=>{ if(o!==g){ const p=o.querySelector('path'); if(p) p.style.opacity='.45'; } }); }; g.addEventListener('pointerenter',f); g.addEventListener('pointerdown',f); }); svg.addEventListener('pointerleave',()=>svg.querySelectorAll('g path').forEach(p=>p.style.opacity='')); }

  rpc('resumen_negocio').then(r=>{ $('#k').innerHTML=[['Clientes',r.clientes],['Compras (30 d)',r.compras],['Ventas (30 d)',soles(r.ventas)],['Sellos (30 d)',r.sellos],['Premios ganados',r.premios_otorgados],['Premios canjeados',r.premios_canjeados]].map(([l,v])=>`<div class="kpi"><div class="n">${v}</div><div class="l">${l}</div></div>`).join(''); }).catch(()=>{});
  $('#qrmat').onclick=()=>materialQR(n.slug);
  $('#c_logo').onchange=()=>{ const f=$('#c_logo').files[0]; if(!f) return; const u=URL.createObjectURL(f); $('#c_pv').innerHTML=`<img src="${u}" alt="">`; $('#c_lt').textContent='Logo nuevo (toca Guardar cambios)'; };
  $('#addp').onclick=()=>$('#fp').classList.toggle('hidden');
  $('#fp').onsubmit=async ev=>{ev.preventDefault(); try{ const rol=$('#pr').value, nom=$('#pn').value.trim(); await rpc('guardar_personal',{p_nombre:nom,p_rol:rol,p_pin:$('#pp').value}); if(rol!=='mesero' && !(desbloq.hasta>Date.now())) desbloq={hasta:Date.now()+BLOQ_MIN*60000,nombre:nom}; await cargarPanel(); }catch(e){ const m=$('#mp'); m.textContent=e.message; m.classList.remove('hidden'); }};
  $('#pl').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{ try{ await rpc('desactivar_personal',{p_id:b.dataset.id,p_activo:b.dataset.act!=='true'}); await cargarPanel(); }catch(e){ alertMsg(e.message);} });
  let t; $('#cq').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{ const l=await rpc('buscar_clientes',{p_q:$('#cq').value}); $('#cl').innerHTML=l.map(c=>{const link=`${BASE_URL}?t=${c.token}`; return `<div class="item"><div class="avatar">${ini(c.nombre)}</div><div class="grow"><div class="t">${esc(c.nombre)}</div><div class="s">${c.celular}</div></div><a class="btn sm ghost" style="text-decoration:none;height:36px;padding:0 10px" href="https://wa.me/51${c.celular}?text=${encodeURIComponent(msgTarjeta(c.nombre, n.nombre, link))}" target="_blank" rel="noopener"><span style="width:18px;height:18px">${icon.wa}</span></a></div>`}).join('')||'<p class="hint">Sin resultados.</p>'; },300)};
  $('#fc').onsubmit=async ev=>{ev.preventDefault(); const m=$('#mc'); m.className='msg hidden'; try{ let logo=null; const f=$('#c_logo').files[0]; if(f){ if(f.size>3*1024*1024) throw new Error('El logo pesa más de 3 MB; usa una imagen más liviana.'); logo=await logoPNG(f); }
    await rpc('actualizar_negocio',{p_nombre:$('#c_nombre').value,p_premio:$('#c_premio').value,p_monto_minimo:parseFloat($('#c_min').value),p_meta:parseInt($('#c_meta').value),p_vigencia:parseInt($('#c_vig').value),p_whatsapp:$('#c_wa').value,p_direccion:$('#c_dir').value,p_logo_url:logo,p_color_primario:n.color_primario||null,p_color_acento:n.color_acento||null});
    await cargarPanel(); }catch(e){ m.className='msg err'; m.textContent=e.message; }};
  $('#out').onclick=salir;
}
// Logo: se guarda siempre como PNG (Apple Wallet solo acepta PNG) y se achica hasta pesar menos de 200 KB.
async function logoPNG(f){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error('No se pudo leer la imagen del logo.')); i.src=url;});
    for(const lado of [600,480,360,260]){
      const k=Math.min(1, lado/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL('image/png'); if(d.length*0.75 < 200*1024) return d;
    }
    throw new Error('El logo es muy pesado incluso achicado; usa una imagen más simple.');
  } finally { URL.revokeObjectURL(url); }
}
// Cerrar sesión a prueba de fallos: intenta avisar al servidor, pero igual borra la sesión del equipo y recarga.
async function salir(){
  try{ await Promise.race([sb.auth.signOut({scope:'local'}), new Promise(r=>setTimeout(r,3000))]); }catch{}
  try{ Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k)); }catch{}
  location.replace(BASE_URL);
}
// Aviso flotante único: si ya hay uno, se reemplaza (nunca se apilan) y se oculta solo a los 4 s.
let _avisoT;
function alertMsg(t){
  let el=document.getElementById('aviso');
  if(!el){ el=document.createElement('div'); el.id='aviso'; el.className='msg err aviso'; el.setAttribute('role','alert'); el.onclick=()=>el.classList.remove('ver'); document.body.appendChild(el); }
  el.textContent=t; el.classList.add('ver');
  clearTimeout(_avisoT); _avisoT=setTimeout(()=>el.classList.remove('ver'),4000);
}

// ----- Escáner QR (usa la cámara si el navegador lo permite) -----
async function escanear(onResult){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices){ alertMsg('Este navegador no permite escanear; escribe el celular del cliente.'); return; }
  const ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column';
  ov.innerHTML='<video autoplay playsinline style="flex:1;width:100%;object-fit:cover"></video><button class="btn" style="border-radius:0">Cancelar</button>';
  document.body.appendChild(ov); const video=ov.querySelector('video'); let stream, stop=false;
  const cerrar=()=>{ stop=true; if(stream) stream.getTracks().forEach(t=>t.stop()); ov.remove(); }; ov.querySelector('button').onclick=cerrar;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); video.srcObject=stream; const det=new BarcodeDetector({formats:['qr_code']});
    const loop=async()=>{ if(stop) return; try{ const codes=await det.detect(video); if(codes.length){ cerrar(); onResult(codes[0].rawValue); return; } }catch{} requestAnimationFrame(loop); }; video.onloadedmetadata=()=>loop();
  }catch(e){ cerrar(); alertMsg('No se pudo abrir la cámara. Escribe el celular del cliente.'); }
}
